<path d="M490 360 L510 360" stroke="#9a9a9a" stroke-width="6"/><text x="500" y="492" text-anchor="middle" font-size="11" fill="#666">Sơ đồ mô phỏng, không theo tỉ lệ – Simplified schematic, not to scale</text></svg>