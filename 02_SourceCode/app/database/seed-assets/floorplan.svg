<rect x="20" y="40" width="470" height="440" rx="14" fill="#ffffff" stroke="#9a9a9a" stroke-width="2"/>
<rect x="510" y="40" width="470" height="440" rx="14" fill="#ffffff" stroke="#9a9a9a" stroke-width="2"/>
<text x="255" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Tầng 1 · Floor 1</text>
<text x="745" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Tầng 2 · Floor 2</text>
<g id="room-main_hall"><rect x="30" y="70" width="220" height="190" rx="10" fill="#e4572e" fill-opacity="0.16" stroke="#e4572e" stroke-width="3"/><text x="140" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#e4572e">Sảnh chính</text><text x="140" y="184" text-anchor="middle" font-size="14" fill="#444">Main Hall</text><circle cx="140" cy="170" r="4" fill="#e4572e" opacity="0"/></g>
