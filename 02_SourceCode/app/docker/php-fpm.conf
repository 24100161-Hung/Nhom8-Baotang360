; Pool "www" cho BaoTang360: nghe 9000 (Nginx service "web" gọi fastcgi_pass app:9000)
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 9000
; Giữ biến môi trường của container (DB_*, APP_KEY, ANALYTICS_*) cho Laravel
clear_env = no
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
