; BaoTang360 – các tiến trình trong container app (nginx + php-fpm + scheduler); dịch vụ Python chạy container riêng
[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; thay cron: schedule:run mỗi phút (expire orders, sync views, backup 02:00, reindex 10', healthz 5')
command=/bin/bash -c "while true; do sleep 60; php artisan schedule:run >> storage/logs/scheduler.log 2>&1 || true; done"
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
