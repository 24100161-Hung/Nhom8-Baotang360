# BaoTang360 – Nginx 1.27 trước php-fpm (app:9000). Tệp template: biến ${FORCE_HTTPS} do image nginx thay bằng envsubst.
# Cache-Control đặt bằng add_header (không dùng expires để tránh header trùng).
# Security headers chính (CSP nonce, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, HSTS) do Laravel đặt;
# Nginx chỉ bổ sung cho tệp tĩnh.

server_tokens off;

map $http_x_forwarded_proto $bt_forwarded_https {
    default 0;
    https   1;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 50M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml font/woff2;

    # HTTP → HTTPS chỉ khi FORCE_HTTPS=true và request chưa đi qua TLS (trực tiếp hoặc qua proxy)
    set $bt_redirect "${FORCE_HTTPS}";
    if ($bt_forwarded_https = 1) { set $bt_redirect "false"; }
    if ($scheme = https) { set $bt_redirect "false"; }
    if ($bt_redirect = "true") { return 301 https://$host$request_uri; }

    # /healthz không ghi access log (Docker gọi mỗi 30 giây)
    location = /healthz {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Tệp build Vite có hash trong tên → cache 1 năm, immutable
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Tiles 360 đa phân giải: tên tệp ổn định theo scene, cache 1 năm
    location ^~ /storage/tiles/ {
        # Tệp tải lên/seed không bao giờ được thực thi hay hiển thị như HTML/JS
        location ~* \.(php\d?|phtml|phar|html?|xhtml|js|mjs|cgi|pl|sh)$ {
            return 403;
        }
        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /storage/ {
        # Tệp tải lên/seed không bao giờ được thực thi hay hiển thị như HTML/JS
        location ~* \.(php\d?|phtml|phar|html?|xhtml|js|mjs|cgi|pl|sh)$ {
            return 403;
        }
        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|gif|svg|woff2?|ttf|mp3)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Chỉ front controller được chạy PHP
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Gói nginx 1.26.3+ của Debian đặt HTTP_HOST=$host (mất cổng) → Laravel sinh URL asset thiếu :8080, bị CSP chặn, trang trắng.
        # Truyền lại Host nguyên bản của client để request()->root() đúng cổng khi chạy ngoài cổng 80.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
