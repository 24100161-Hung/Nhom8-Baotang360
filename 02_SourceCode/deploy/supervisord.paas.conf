; BaoTang360 – image PaaS "tất cả trong một" (nginx + php-fpm + scheduler + dịch vụ Python)
; Thay đổi: chương trình [program:analytics] nhận giá trị autostart từ biến môi
; trường ANALYTICS_AUTOSTART do entrypoint xuất ra (true/false). Trên gói Render
; Free (512 MB RAM) đặt ANALYTICS_ENABLED=false để không khởi động uvicorn.
[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; thay cron: schedule:run mỗi phút (expire orders, sync views, backup 02:00, reindex 10', healthz 5')
command=/bin/bash -c "while true; do sleep 60; php artisan schedule:run >> storage/logs/scheduler.log 2>&1 || true; done"
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:analytics]
command=/usr/local/bin/python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/srv/analytics
user=analytics
environment=STORAGE_ROOT="/var/www/html/storage/app",PYTHONUNBUFFERED="1",TILES_MAX_INPUT_WIDTH="4096"
autostart=%(ENV_ANALYTICS_AUTOSTART)s
autorestart=%(ENV_ANALYTICS_AUTOSTART)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
